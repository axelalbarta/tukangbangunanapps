# Membangun aplikasi Android "Arsip TB" (APK untuk dipasang langsung + AAB untuk Play Store).
# Berjalan otomatis setiap ada perubahan di folder android/, atau manual dari tab Actions.
name: Bangun aplikasi Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Siapkan kunci tanda tangan
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/arsiptb.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/arsiptb.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret KEYSTORE_BASE64 belum diisi. Dibuat APK debug (untuk uji saja). Jalankan workflow 'Buat kunci Android' dulu."
          fi

      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            gradle assembleRelease bundleRelease --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Kumpulkan hasil & buat assetlinks.json
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p hasil
          if [ -n "$KEYSTORE_FILE" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "hasil/ArsipTB-v1.0.${{ github.run_number }}.apk"
            cp android/app/build/outputs/bundle/release/app-release.aab "hasil/ArsipTB-v1.0.${{ github.run_number }}.aab"
            SHA=$(keytool -list -v -keystore "$KEYSTORE_FILE" -alias "${KEY_ALIAS:-arsiptb}" -storepass "$KEYSTORE_PASSWORD" | grep -m1 'SHA256:' | awk '{print $2}')
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "hasil/ArsipTB-DEBUG-${{ github.run_number }}.apk"
            SHA=$(keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | grep -m1 'SHA256:' | awk '{print $2}')
          fi
          cat > hasil/assetlinks.json <<JSON
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "com.tukangbangunan.arsip",
              "sha256_cert_fingerprints": ["$SHA"]
            }
          }]
          JSON
          {
            echo "## Aplikasi Android siap"
            echo "Unduh file di bagian **Artifacts** di bawah (ArsipTB-android)."
            echo ""
            echo "Sidik jari SHA-256 kunci: \`$SHA\`"
            echo ""
            echo "Upload \`assetlinks.json\` ke server: \`public_html/.well-known/assetlinks.json\` supaya bilah alamat browser hilang."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ArsipTB-android
          path: hasil/

      - name: Terbitkan di halaman Releases (bisa diunduh langsung dari HP)
        if: env.KEYSTORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Arsip TB Android v1.0.${{ github.run_number }}
          body: |
            Pasang di HP Android: unduh file .apk lalu buka. Izinkan "Instal dari sumber ini" jika diminta.
            File .aab untuk upload ke Google Play Console.
          files: |
            hasil/*.apk
            hasil/*.aab
            hasil/assetlinks.json
